name: remote_read_file
title: 读取远端文件
description: 在目标主机读取文件内容（只读；支持 max_bytes / offset / tail_lines）。
version: "1.0.0"
author: chiby-maintainers
category: remote_fs
skill_pack: remote_fs
type: host_readonly
host_required: true
status: approved
parameters:
  - name: host
    type: string
    description: 主机 id 或 hostname
    required: true
  - name: path
    type: string
    description: 远端绝对路径
    required: true
  - name: max_bytes
    type: integer
    required: false
  - name: offset
    type: integer
    required: false
  - name: tail_lines
    type: integer
    required: false
security:
  risk_level: low
  needs_confirmation: false
  read_only: true
executor:
  type: python_function
  entry: run
  delegates_to: terminal.mobile.remote_tools
usage_example: |
  {"tool":"remote_read_file","host":"web1","path":"/var/log/nginx/error.log","tail_lines":100}
