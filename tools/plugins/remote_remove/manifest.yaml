name: remote_remove
title: 删除远端文件或目录
description: 删除目标主机上的文件/目录（须确认卡；recursive 删目录）。
version: "1.0.0"
author: chiby-maintainers
category: remote_fs
skill_pack: remote_fs
type: host_write
host_required: true
status: approved
parameters:
  - name: host
    type: string
    required: true
  - name: path
    type: string
    required: true
  - name: recursive
    type: boolean
    required: false
confirm_fields:
  - host
  - path
  - recursive
  - preview
security:
  risk_level: high
  needs_confirmation: true
  is_mutate: true
  read_only: false
executor:
  type: python_function
  entry: run
  delegates_to: terminal.mobile.remote_tools
usage_example: |
  {"tool":"remote_remove","host":"web1","path":"/tmp/old","recursive":true}
