name: remote_restore
title: 从备份恢复远端文件
description: 用 .hermes_backups 中的备份恢复文件（须确认卡；可指定 backup_path）。
version: "1.0.0"
author: chiby-maintainers
category: remote_fs
skill_pack: remote_fs
type: host_write
host_required: true
status: approved
parameters:
  - name: host
    type: string
    required: true
  - name: path
    type: string
    required: true
  - name: backup_path
    type: string
    required: false
confirm_fields:
  - host
  - path
  - backup_path
  - preview
security:
  risk_level: high
  needs_confirmation: true
  is_mutate: true
  read_only: false
executor:
  type: python_function
  entry: run
  delegates_to: terminal.mobile.remote_tools
dependencies:
  - id: remote_backup
    kind: tool
    optional: false
usage_example: |
  {"tool":"remote_restore","host":"web1","path":"/etc/nginx/nginx.conf"}
