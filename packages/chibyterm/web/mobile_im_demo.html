    function copyTextToClipboard(text) {
      const raw = String(text || '');
      if (!raw) return Promise.reject(new Error('empty'));
      if (navigator.clipboard && navigator.clipboard.writeText) {
        return navigator.clipboard.writeText(raw);
      }
      return new Promise(function (resolve, reject) {
        try {
          const ta = document.createElement('textarea');
          ta.value = raw;
          ta.setAttribute('readonly', '');
          ta.style.position = 'fixed';
          ta.style.left = '-9999px';
          document.body.appendChild(ta);
          ta.select();
          const ok = document.execCommand('copy');
          document.body.removeChild(ta);
          if (ok) resolve();
          else reject(new Error('execCommand failed'));
        } catch (err) {
          reject(err);
        }
      });
    }

    function attachCopyButton(hostEl, getText, opts) {
      const o = opts || {};
      if (!hostEl) return null;
      let btn = hostEl.querySelector(':scope > .bubble-copy-btn, :scope > .foot > .bubble-copy-btn');
      if (!btn && o.footEl) {
        btn = o.footEl.querySelector('.bubble-copy-btn');
      }
      if (!btn) {
        btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'bubble-copy-btn';
        btn.title = '复制内容';
        btn.setAttribute('aria-label', '复制内容');
        btn.innerHTML = bubbleCopyIconSvg();
        if (o.footEl) {
          if (o.placement === 'start' && o.footEl.firstChild) {
            o.footEl.insertBefore(btn, o.footEl.firstChild);
          } else {
            o.footEl.appendChild(btn);
          }
        } else {
          hostEl.appendChild(btn);
        }
      }
      btn.onclick = function (ev) {
        ev.preventDefault();
        ev.stopPropagation();
        const text = typeof getText === 'function' ? getText() : String(getText || '');
        copyTextToClipboard(text).then(function () {
          btn.classList.add('copied');
          btn.title = '已复制';
          setTimeout(function () {
            btn.classList.remove('copied');
            btn.title = '复制内容';
          }, 1200);
        }).catch(function () {
          btn.title = '复制失败';
          setTimeout(function () { btn.title = '复制内容'; }, 1500);
        });
      };
      return btn;
    }

    function addBubble(role, text, opts) {
      const o = opts || {};
      const tsDate =
        o.ts_ms != null
          ? new Date(Number(o.ts_ms))
          : o.ts_iso
            ? new Date(String(o.ts_iso))
            : new Date();
      const when = isNaN(tsDate.getTime()) ? new Date() : tsDate;
      const ts = o.ts && !o.ts_ms && !o.ts_iso ? String(o.ts) : formatBubbleTs(when);
      const d = document.createElement('div');
      d.className = 'bubble ' + role;
      d.setAttribute('data-ts', ts);
      if (role === 'sys') {
        const textEl = document.createElement('span');
        textEl.className = 'sys-text';
        textEl.textContent = text;
        const tsEl = document.createElement('span');
        tsEl.className = 'sys-ts';
        tsEl.textContent = ts;
        tsEl.title = ts;
        d.appendChild(textEl);
        d.appendChild(tsEl);
      } else if (role === 'user') {
        const body = document.createElement('div');
        body.className = 'body';
        body.textContent = text;
        const foot = document.createElement('div');
        foot.className = 'foot';
        const tsEl = document.createElement('div');
        tsEl.className = 'bubble-ts';
        tsEl.textContent = ts;
        foot.appendChild(tsEl);
        d.appendChild(body);
        d.appendChild(foot);
        attachCopyButton(d, function () { return text; }, { footEl: foot, placement: 'start' });
      } else {
        // bot 等输出面板：正文 + 脚注 + 右下角复制
        const body = document.createElement('div');
        body.className = 'body';
        body.textContent = text;
        const foot = document.createElement('div');
        foot.className = 'foot';
        const footMeta = document.createElement('span');
        footMeta.className = 'foot-meta';
        footMeta.textContent = ts;
        foot.appendChild(footMeta);
        d.appendChild(body);
        d.appendChild(foot);
        attachCopyButton(d, function () { return text; }, { footEl: foot });
      }
      logEl.appendChild(d);
      trimLiveLogIfNeeded();
      // 用户气泡强制贴底；助手/系统仅在已看底部时跟随，避免展开历史结果时跳底
      scrollLogToBottom({ force: role === 'user' });
      if (!o.skipPersist) {
        appendTranscript({
          role: role,
          text: text,
          ts: ts,
          ts_ms: when.getTime(),
          ts_iso: when.toISOString(),
          kind: o.kind || '',
        });
      }
      return d;
    }

    function restoreTranscript() {
      const list = loadTranscript();
      if (!list.length) return false;
      for (const item of list) {
        const role = item.role;
        if (role !== 'user' && role !== 'bot' && role !== 'sys') continue;
        const text = String(item.text || '');
        if (!text) continue;
        if (item.kind === 'host_panel') {
          restoreHostPanelFromEntry(item);
          continue;
        }
        const tsShow = displayTsForEntry(item);
        if (role === 'bot') {
          // 与实时气泡同一套 Markdown 渲染（确认卡交互态仍不复原）
          const d = document.createElement('div');
          d.className = 'bubble bot';
          d.setAttribute('data-ts', tsShow);
          d.innerHTML = '<div class="body"></div><div class="foot"><span class="foot-meta"></span></div>';
          setBotBody(d.querySelector('.body'), text, { forceMarkdown: true });
          const foot = d.querySelector('.foot');
          const footMeta = d.querySelector('.foot-meta');
          if (footMeta) footMeta.textContent = tsShow;
          attachCopyButton(d, function () { return text; }, { footEl: foot });
          logEl.appendChild(d);
        } else {
          addBubble(role, text, {
            ts: tsShow,
            ts_ms: item.ts_ms,
            ts_iso: item.ts_iso,
            skipPersist: true,
          });
        }
      }
      trimLiveLogIfNeeded();
      scrollLogToBottom();
      return true;
    }

    function startWaiting(label, opts) {
      const rawHermes = !!(opts && opts.rawHermes);
      const ts = (opts && opts.termStatus) || activeTermStatus || createTerminalStatus({ mode: agentMode });
      activeTermStatus = ts;
      let contentReady = false;

      // 中间态只显示在输入栏，不写入对话区
      ts.subscribe(function (line) {
        if (contentReady) return;
        setComposerBusyHint(line);
      });
      if (label) ts.onRaw(label, {});
      else ts.forcePaint();

      if (waitTimer) { clearInterval(waitTimer); waitTimer = null; }
      waitTimer = setInterval(function () {
        if (!contentReady) ts.tick();
      }, 400);

      return {
        el: null,
        t0: ts.t0,
        rawHermes: rawHermes,
        termStatus: ts,
        setPhase(t) {
          if (!contentReady) ts.onRaw(t, {});
        },
        upsertThought(ev) {
          if (!contentReady) ts.onThought(ev);
        },
        markContentReady() {
          if (contentReady) return;
          contentReady = true;
          if (composerRow) composerRow.classList.add('status-settled');
          if (composerBusyText) composerBusyText.textContent = '';
        },
        stop() {
          this.markContentReady();
        },
      };
    }

    /** 深度思考展示用：REMOTE_TOOL / OPS_* 收成摘要，避免整段脚本像乱码 */
    function summarizeThoughtForDisplay(raw) {
      let t = String(raw || '').replace(/\r\n/g, '\n');

      function toolChannelLabel(tool) {
        const x = String(tool || '').toLowerCase();
        if (x === 'winrm_execute') return 'WinRM';
        if (x === 'ssh_execute') return 'SSH';
        if (x === 'remote_run') return '远端执行';
        if (x === 'remote_write_file') return '写文件';
        if (x === 'remote_remove') return '删除';
        if (x === 'remote_mkdir') return '建目录';
        if (x === 'remote_read_file') return '读文件';
        if (x === 'remote_restore' || x === 'remote_rollback') return '恢复';
        if (x === 'host_list') return '主机列表';
        if (x === 'remote_grep' || x === 'remote_logs') return '日志检索';
        return tool || '工具';
      }

      function guessPurpose(tool, cmd, path) {
        const c = String(cmd || '');
        const cl = c.toLowerCase();
        const p = String(path || '').trim();
        const tl = String(tool || '').toLowerCase();
        if (tl === 'remote_remove') return p ? ('删除 ' + p) : '删除路径';
        if (tl === 'remote_write_file') return p ? ('写入 ' + p) : '写入文件';
        if (tl === 'remote_mkdir') return p ? ('创建 ' + p) : '创建目录';
        if (tl === 'remote_read_file') return p ? ('读取 ' + p) : '读取文件';
        if (tl === 'remote_restore' || tl === 'remote_rollback') {
          return p ? ('恢复 ' + p) : '恢复备份';
        }
        if (tl === 'host_list') return '列出可用主机';
        if (
          /loadpercentage|win32_processor|win32_operatingsystem|win32_logicaldisk/.test(cl) ||
          (/\bcpu\b/.test(cl) && /\bmem/.test(cl)) ||
          (/free\b/.test(cl) && /\bdf\b/.test(cl)) ||
          /uptime|vmstat|\/proc\/loadavg/.test(cl)
        ) {
          return '采集系统负载（CPU/内存/磁盘等）';
        }
        if (/\b(nginx|httpd|sshd|mysql|redis)\b/.test(cl) && /systemctl|Get-Service|sc\s+query/i.test(c)) {
          return '检查服务状态';
        }
        if (/journalctl|Get-EventLog|Get-WinEvent|\btail\b|\bgrep\b/.test(c)) {
          return '查看日志';
        }
        if (c.length > 0) {
          const one = c.replace(/\s+/g, ' ').trim().slice(0, 42);
          return '执行命令（' + one + (c.length > 42 ? '…' : '') + '）';
        }
        return '调用远端工具';
      }

      function formatCallsFromInner(inner) {
        let data = null;
        const s = String(inner || '').trim();
        try { data = JSON.parse(s); } catch (_) {
          const m = s.match(/\{[\s\S]*\}|\[[\s\S]*\]/);
          if (m) {
            try { data = JSON.parse(m[0]); } catch (_) { data = null; }
          }
        }
        const calls = Array.isArray(data) ? data : (data && typeof data === 'object' ? [data] : []);
        if (!calls.length) {
          return '[远端工具] 已规划工具调用（完整命令见下方执行结果）';
        }
        return calls.map((c) => {
          if (!c || typeof c !== 'object') {
            return '[远端工具] 已规划工具调用（完整命令见下方执行结果）';
          }
          const tool = String(c.tool || c.name || '').trim();
          const host = String(
            c.host || (Array.isArray(c.hosts) && c.hosts[0]) || '',
          ).trim();
          const cmd = String(c.command || c.script || '').trim();
          const path = String(c.path || '').trim();
          let line = '[远端工具] ' + toolChannelLabel(tool) + ' · ' + guessPurpose(tool, cmd, path);
          if (host) line += '\n主机: ' + host;
          line += '\n（完整命令见下方「远端执行结果」）';
          return line;
        }).join('\n');
      }

      // 完整 REMOTE_TOOL 块 → 摘要
      t = t.replace(
        /<<<\s*REMOTE_TOOLS?\s*>>>\s*([\s\S]*?)\s*<<<\s*END_REMOTE_TOOLS?\s*>>>/gi,
        (_, inner) => '\n' + formatCallsFromInner(inner) + '\n',
      );
      t = t.replace(
        /(?:^|\n)\s*REMOTE_TOOLS?\s*>>>\s*([\s\S]*?)\s*END_REMOTE_TOOLS?\s*>>>/gi,
        (_, inner) => '\n' + formatCallsFromInner(inner) + '\n',
      );

      // 流式未闭合：不要露出半截 JSON/长脚本
      const openRt = t.search(/<<<\s*REMOTE_TOOLS?\s*>>>/i);
      if (openRt >= 0 && !/<<<\s*END_REMOTE_TOOLS?\s*>>>/i.test(t.slice(openRt))) {
        t = t.slice(0, openRt) + '\n[正在准备远端工具调用…]\n';
      } else {
        const openRt2 = t.search(/(?:^|\n)\s*REMOTE_TOOLS?\s*>>>/i);
        if (openRt2 >= 0 && !/END_REMOTE_TOOLS?\s*>>>/i.test(t.slice(openRt2))) {
          t = t.slice(0, openRt2) + '\n[正在准备远端工具调用…]\n';
        }
      }

      // TASK_STATUS → 短句（避免 JSON 块刷屏）
      t = t.replace(
        /<<<\s*TASK_STATUS\s*>>>\s*([\s\S]*?)\s*<<<\s*END_TASK_STATUS\s*>>>/gi,
        (_, inner) => {
          try {
            const j = JSON.parse(String(inner || '').trim());
            const ph = (j && j.phase) || '';
            const rs = (j && j.reason) || '';
            return '\n[任务状态: ' + ph + (rs ? (' / ' + rs) : '') + ']\n';
          } catch (e) {
            return '\n[任务状态更新]\n';
          }
        },
      );

      // OPS 契约块同样收成短句
      t = t.replace(
        /<<<\s*OPS_PLAN\s*>>>[\s\S]*?<<<\s*END_OPS_PLAN\s*>>>/gi,
        '\n[已生成执行计划]\n',
      );
      t = t.replace(
        /<<<\s*OPS_JOB\s*>>>[\s\S]*?<<<\s*END_OPS_JOB\s*>>>/gi,
        '\n[已生成多机任务]\n',
      );
      const openOps = t.search(/<<<\s*OPS_(?:PLAN|JOB)\s*>>>/i);
      if (openOps >= 0 && !/<<<\s*END_OPS_(?:PLAN|JOB)\s*>>>/i.test(t.slice(openOps))) {
        t = t.slice(0, openOps) + '\n[正在生成执行计划…]\n';
      }

      return t;
    }

    function createDeepThinkPanel(beforeEl) {
      const wrap = document.createElement('div');
      wrap.className = 'deep-think streaming';
      wrap.innerHTML =
        '<button type="button" class="deep-think-toggle" aria-expanded="true">' +
        '<svg class="dt-icon" viewBox="0 0 16 16" aria-hidden="true">' +
        '<path fill="currentColor" d="M8 1.5a3.2 3.2 0 0 0-3.2 3.2c0 1.1.5 2 1.3 2.7L4.4 12h7.2l-1.7-4.6c.8-.7 1.3-1.6 1.3-2.7A3.2 3.2 0 0 0 8 1.5zm0 1.2a2 2 0 1 1 0 4 2 2 0 0 1 0-4zM5.2 13.2h5.6v1.1H5.2z"/>' +
        '</svg>' +
        '<span class="dt-label">深度思考</span>' +
        '<svg class="dt-chevron" viewBox="0 0 12 12" aria-hidden="true">' +
        '<path fill="currentColor" d="M2.2 4.2 6 8l3.8-3.8.9.9L6 9.8 1.3 5.1z"/>' +
        '</svg></button>' +
        '<div class="deep-think-body"></div>';
      // 闭环常先推执行结果 delta（已有气泡），思考流后到：须插到气泡前，避免「深度思考」沉底
      if (beforeEl && beforeEl.parentNode === logEl) {
        logEl.insertBefore(wrap, beforeEl);
      } else {
        logEl.appendChild(wrap);
      }
      const body = wrap.querySelector('.deep-think-body');
      const btn = wrap.querySelector('.deep-think-toggle');
      let full = '';
      let collapsedDone = false;

      attachCopyButton(wrap, function () {
        return displayThought() || full;
      });

      function normalizeThought(s) {
        // 思考流常夹多余空行：压成单换行，去掉行尾空白
        return String(s || '')
          .replace(/\r\n/g, '\n')
          .replace(/[ \t]+\n/g, '\n')
          .replace(/\n{2,}/g, '\n')
          .replace(/^\n+/, '');
      }

      function displayThought() {
        return normalizeThought(summarizeThoughtForDisplay(full));
      }

      /** 面板内贴底：布局未完成时 scrollHeight 会偏小，双 rAF + 微延迟再滚一次 */
      function stickBodyBottom() {
        const go = () => {
          body.scrollTop = body.scrollHeight;
        };
        go();
        requestAnimationFrame(() => {
          go();
          requestAnimationFrame(() => {
            go();
            setTimeout(go, 32);
          });
        });
      }

      function paintThought() {
        body.textContent = displayThought();
        stickBodyBottom();
        scrollLogToBottom();
      }

      btn.addEventListener('click', () => {
        if (wrap.classList.contains('streaming')) return;
        wrap.classList.toggle('open');
        btn.setAttribute('aria-expanded', wrap.classList.contains('open') ? 'true' : 'false');
        if (wrap.classList.contains('open')) {
          stickBodyBottom();
        }
      });

      return {
        el: wrap,
        append(delta) {
          full += delta;
          paintThought();
        },
        collapse() {
          const shown = displayThought();
          if (collapsedDone || !shown.trim()) {
            if (!shown.trim() && wrap.parentNode) wrap.parentNode.removeChild(wrap);
            return;
          }
          collapsedDone = true;
          wrap.classList.remove('streaming');
          /* 结束后仍保持展开，用户可手动点标题收起 */
          wrap.classList.add('open');
          btn.setAttribute('aria-expanded', 'true');
          body.textContent = shown;
          stickBodyBottom();
          scrollLogToBottom();
        },
        get text() { return full; },
      };
    }

    function createStreamBubble() {
      const d = document.createElement('div');
      d.className = 'bubble bot';
      d.innerHTML = '<div class="body"></div><div class="foot"><span class="foot-meta"></span></div>';
      const body = d.querySelector('.body');
      const foot = d.querySelector('.foot');
      const footMeta = d.querySelector('.foot-meta');
      let full = '';
      let renderTimer = null;
      let revealTimer = null;
      let revealQueue = '';
      logEl.appendChild(d);

      attachCopyButton(d, function () {
        return full + revealQueue;
      }, { footEl: foot });

      function paint(finalPass) {
        // 流式阶段：有 Markdown 迹象再渲染；结束时强制完整渲染（避免一直停在 textContent）
        // Markdown 可以流式重渲染；半截表格/代码块靠 debounce，不是「不能流式」
        if (finalPass) {
          setBotBody(body, full, { forceMarkdown: true });
        } else if (looksLikeMarkdown(full)) {
          setBotBody(body, full, { asMarkdown: true });
        } else {
          setBotBody(body, full, { asMarkdown: false });
        }
        scrollLogToBottom();
      }

      function schedulePaint(immediate) {
        if (immediate) {
          if (renderTimer) {
            clearTimeout(renderTimer);
            renderTimer = null;
          }
          paint(false);
          return;
        }
        if (renderTimer) return;
        renderTimer = setTimeout(() => {
          renderTimer = null;
          paint(false);
        }, 32);
      }

      function pumpReveal() {
        revealTimer = null;
        if (!revealQueue) return;
        // 大块 delta 按片露出，避免 Hermes 一次吐整段时「突然出现」
        const n = Math.min(48, revealQueue.length);
        full += revealQueue.slice(0, n);
        revealQueue = revealQueue.slice(n);
        schedulePaint(n >= 40 || /<<<END_EXEC_BODY>>>|\n\n/.test(full.slice(-80)));
        if (revealQueue) {
          revealTimer = setTimeout(pumpReveal, 12);
        }
      }

      return {
        el: d,
        append(delta) {
          const t = String(delta || '');
          if (!t) return;
          // 已有渐进队列时，短 delta 也入队，避免熔断等短文案插到未露出的长正文中间
          if (t.length > 240 || revealQueue) {
            revealQueue += t;
            if (!revealTimer) pumpReveal();
            return;
          }
          full += t;
          schedulePaint(/<<<END_EXEC_BODY>>>|\n\n/.test(t));
        },
        finalize(meta) {
          if (revealTimer) {
            clearTimeout(revealTimer);
            revealTimer = null;
          }
          if (revealQueue) {
            full += revealQueue;
            revealQueue = '';
          }
          if (renderTimer) {
            clearTimeout(renderTimer);
            renderTimer = null;
          }
          const tsDate = new Date();
          const ts = formatBubbleTs(tsDate);
          d.setAttribute('data-ts', ts);
          const parts = [];
          if (meta) parts.push(String(meta));
          parts.push(ts);
          if (footMeta) footMeta.textContent = parts.join(' · ');
          else foot.textContent = parts.join(' · ');
          paint(true);
          // 任何模式都默认完整展开：不自动加 collapsed /「展开全部」
          d.classList.remove('collapsed');
          trimLiveLogIfNeeded();
          scrollLogToBottom();
          // 本地：压缩保留折叠结构；审计：上报未截断全文
          const persistText = persistBotTextForTranscript(full) || (meta ? String(meta) : '');
          appendTranscript({
            role: 'bot',
            text: persistText,
            audit_text: String(full || persistText),
            ts: ts,
            ts_ms: tsDate.getTime(),
            ts_iso: tsDate.toISOString(),
            kind: 'stream',
          });
        },
        get text() { return full + revealQueue; },
        setText(t) {
          if (revealTimer) {
            clearTimeout(revealTimer);
            revealTimer = null;
          }
          revealQueue = '';
          full = String(t || '');
          paint(true);
        },
      };
    }

    /** done 到达时合并最终 text：已有更长流式正文时禁止用短摘要覆盖 */
    function applyDoneTextToStream(streamBubble, displayText, meta) {
      const streamed = streamBubble.text || '';
      const final = String(displayText || '');
      if (!final) return;
      if (final === streamed) return;
      const markedStreamed = !!(meta && meta.streamed);
      const keepStream =
        streamed.length >= 40 &&
        (
          markedStreamed ||
          final.length < streamed.length * 0.9 ||
          streamed.indexOf(final.slice(0, Math.min(48, final.length))) >= 0
        );
      if (keepStream) {
        // 仅当最终文案是短补充且流式里没有时追加
        if (
          final.length > 0 &&
          final.length <= 360 &&
          streamed.indexOf(final.slice(0, Math.min(24, final.length))) < 0
        ) {
          streamBubble.append('\n\n' + final);
        }
        return;
      }
      streamBubble.setText(final);
    }

    function addCard(card) {
      const wrap = document.createElement('div');
      const risk = String(card.risk_level || '').toLowerCase();
      const riskClass = (risk === 'high' || risk === 'medium' || risk === 'low')
        ? ('risk-' + risk) : '';
      wrap.className = 'card' + (riskClass ? (' ' + riskClass) : '');
      wrap.setAttribute('data-permission-id', card.permission_id || '');
      const isAgentConfirm = card.card_kind === 'agent_confirm';
      const allowLabel = card.primary_label || (isAgentConfirm ? '执行' : '允许');
      const denyLabel = card.deny_label || (isAgentConfirm ? '取消' : '拒绝');
      const hostIdRaw = String(card.host_id || '').trim();
      let hostShow = String(card.host_label || card.host_id || '').trim();
      // 若 label 仍是裸 id / 短 hex，尽量用更可读形态（后端应已填好；此处兜底）
      if (hostShow && hostIdRaw && hostShow === hostIdRaw && hostShow.length >= 8
          && /^[0-9a-fA-F]+$/.test(hostShow)) {
        hostShow = hostIdRaw;
      }
      let sub = (card.subtitle || '').trim();
      const rb = card.rollback_preview || '';
      const summary = (card.summary_line || '').trim();
      const detailCmd = (card.detail_command || card.command_preview || '').trim();
      const diffPrev = (card.diff_preview || '').trim();
      const impact = (card.impact_hint || '').trim();
      const needTyped = !!card.require_typed_confirm;
      const needOtp = !!card.require_otp;
      // 变更确认卡一律提供解读入口（含高效型高危卡）；仅显式 can_explain=false 时隐藏
      const canExplain = card.can_explain !== false;
      const opLabel = (card.operation_label || '').trim();
      const riskLabel = (card.risk_label || '').trim();
      // 正文里若仍写着裸 host_id，替换为可读名
      if (sub && hostIdRaw && hostShow && hostShow !== hostIdRaw) {
        sub = sub.split(hostIdRaw).join(hostShow);
        if (hostIdRaw.length >= 8) {
          const shortId = hostIdRaw.slice(0, 8);
          // 替换独立短 id（两侧非 hex）
          let out = '';
          let i = 0;
          const low = sub.toLowerCase();
          const needle = shortId.toLowerCase();
          while (i < sub.length) {
            const at = low.indexOf(needle, i);
            if (at < 0) {
              out += sub.slice(i);
              break;
            }
            const before = at > 0 ? sub.charAt(at - 1) : '';
            const after = at + shortId.length < sub.length ? sub.charAt(at + shortId.length) : '';
            const hex = /[0-9a-fA-F]/;
            if (!hex.test(before) && !hex.test(after)) {
              out += sub.slice(i, at) + hostShow;
              i = at + shortId.length;
            } else {
              out += sub.slice(i, at + shortId.length);
              i = at + shortId.length;
            }
          }
          sub = out;
        }
      }
      if (!sub && hostShow) {
        sub = '需确认后执行（主机 ' + hostShow + '）。';
      } else if (sub && hostShow && sub.indexOf(hostShow) < 0 && sub.indexOf('主机') < 0) {
        sub = sub.replace(/[。．]?$/, '') + '（主机 ' + hostShow + '）。';
      }
      const fromAtt = !!card.from_attachment;
      const riskRow = (opLabel || riskLabel || hostShow || fromAtt)
        ? ('<div class="card-risk-row">' +
          (riskLabel ? '<span class="card-risk-badge">' + esc(riskLabel) + '</span>' : '') +
          (opLabel ? '<span>' + esc(opLabel) + '</span>' : '') +
          (fromAtt ? '<span class="card-att-badge">来自附件</span>' : '') +
          (hostShow ? '<span>· ' + esc(hostShow) + '</span>' : '') +
          '</div>')
        : '';
      const summaryHtml = summary
        ? ('<p class="card-summary">' + esc(summary) + '</p>')
        : '';
      const cmdItems = Array.isArray(card.command_items) ? card.command_items : [];
      const batchMode = cmdItems.length > 1;
      let batchHtml = '';
      if (batchMode) {
        let rows = '';
        cmdItems.forEach((it, i) => {
          const idx = (it && typeof it.index === 'number') ? it.index : i;
          const prev = String((it && it.preview) || '').trim() || '(空)';
          const rl = String((it && it.risk_label) || '').trim();
          rows +=
            '<label class="card-batch-item">' +
            '<input type="checkbox" data-batch-idx="' + idx + '" checked />' +
            '<span class="card-batch-risk">' + esc(rl || ('#' + (idx + 1))) + '</span>' +
            '<code>' + esc(prev) + '</code></label>';
        });
        batchHtml =
          '<div class="card-batch" data-batch-wrap>' +
          '<div class="card-batch-head"><span>批量确认（勾选要执行的项）</span>' +
          '<span><button type="button" data-batch-all>全选</button> ' +
          '<button type="button" data-batch-none>全不选</button></span></div>' +
          rows + '</div>';
      }
      let detailsInner =
        (batchMode ? '' : ('<div class="card-cmd-label">完整命令</div>' +
        '<pre class="card-cmd">' + esc(detailCmd || '(无)') + '</pre>'));
      if (diffPrev) {
        detailsInner +=
          '<div class="card-cmd-label">变更对比</div>' +
          '<pre class="card-cmd">' + esc(diffPrev) + '</pre>';
      }
      if (rb) {
        detailsInner +=
          '<div class="card-cmd-label">回滚预览</div>' +
          '<pre class="card-cmd card-cmd-rb">' + esc(rb) + '</pre>';
      }
      if (impact) {
        detailsInner += '<p class="card-impact">影响：' + esc(impact) + '</p>';
      }
      wrap.innerHTML =
        '<div class="card-head">' +
        '<h3>' + esc(card.title || '待确认') + '</h3>' +
        riskRow +
        summaryHtml +
        (sub ? '<p class="card-sub">' + esc(sub) + '</p>' : '') +
        '</div>' +
        batchHtml +
        '<details class="card-details"' + (batchMode ? ' open' : '') + '>' +
        '<summary>展开详情</summary>' +
        detailsInner +
        '</details>' +
        (needTyped
          ? ('<div class="card-typed-confirm" data-typed-wrap>' +
            '<label>高风险二次确认：请输入 YES</label>' +
            '<input type="text" autocomplete="off" spellcheck="false" ' +
            'placeholder="YES" data-typed-input />' +
            '</div>')
          : '') +
        (needOtp
          ? ('<div class="card-typed-confirm" data-otp-wrap>' +
            '<label>动态口令（TOTP / 企业 OTP）</label>' +
            '<input type="text" inputmode="numeric" autocomplete="one-time-code" ' +
            'spellcheck="false" maxlength="8" placeholder="6 位码" data-otp-input />' +
            '</div>')
          : '') +
        ((!needTyped && risk !== 'high')
          ? ('<label class="card-remember" data-remember-wrap>' +
            '<input type="checkbox" data-remember-input />' +
            ' 记住此类（中/低危，限时；高危无效）</label>')
          : '') +
        '<div class="btns">' +
        (canExplain
          ? ('<button type="button" class="explain" title="AI 解读此变更">' +
            '<span class="explain-label">🤖解读变更</span></button>')
          : '') +
        '<button type="button" class="deny">' + esc(denyLabel) + '</button>' +
        '<button type="button" class="allow">' + esc(allowLabel) + '</button>' +
        '</div>';

      let explainViewed = false;
      let explainLoaded = '';
      let explainLoading = false;
      const explainBtn = wrap.querySelector('.btns .explain');
      const EXPLAIN_LABEL = '🤖解读变更';
      const setExplainBtnIdle = () => {
        if (!explainBtn) return;
        explainBtn.disabled = false;
        explainBtn.innerHTML = '<span class="explain-label">' + EXPLAIN_LABEL + '</span>';
      };
      const setExplainBtnLoading = () => {
        if (!explainBtn) return;
        explainBtn.disabled = true;
        explainBtn.innerHTML =
          '<span class="explain-spin" aria-hidden="true"></span>' +
          '<span class="explain-label">' + EXPLAIN_LABEL + '</span>';
      };
      if (explainBtn) {
        explainBtn.onclick = async () => {
          if (explainLoading) return;
          if (explainLoaded) {
            openExplainModal(explainLoaded);
            explainViewed = true;
            return;
          }
          explainLoading = true;
          setExplainBtnLoading();
          openExplainModal('', { loading: true });
          try {
            const res = await fetch('/api/mobile/demo/permission/explain', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                conversation_id: conversationId,
                permission_id: card.permission_id || '',
                external_user_id: userId,
              }),
            });
            let data = null;
            try { data = await res.json(); } catch (_) { data = null; }
            const text = data && data.ok ? String(data.text || '').trim() : '';
            if (!res.ok || !text) {
              const err = (data && (data.error || data.detail)) || ('HTTP ' + res.status);
              openExplainModal('解读失败：' + String(err).slice(0, 240), { error: true });
              setExplainBtnIdle();
              return;
            }
            explainLoaded = text;
            explainViewed = true;
            openExplainModal(text);
            setExplainBtnIdle();
          } catch (e) {
            openExplainModal(
              '解读失败：' + String((e && e.message) || e).slice(0, 240),
              { error: true },
            );
            setExplainBtnIdle();
          } finally {
            explainLoading = false;
          }
        };
      }

      const typedWrap = wrap.querySelector('[data-typed-wrap]');
      const typedInput = wrap.querySelector('[data-typed-input]');
      const otpWrap = wrap.querySelector('[data-otp-wrap]');
      const otpInput = wrap.querySelector('[data-otp-input]');
      const rememberInput = wrap.querySelector('[data-remember-input]');
      const readRemember = () => !!(rememberInput && rememberInput.checked);
      const batchWrap = wrap.querySelector('[data-batch-wrap]');
      const readSelectedIndices = () => {
        if (!batchWrap) return null;
        const boxes = batchWrap.querySelectorAll('input[data-batch-idx]');
        const out = [];
        boxes.forEach((b) => {
          if (b.checked) out.push(parseInt(b.getAttribute('data-batch-idx'), 10));
        });
        return out;
      };
      if (batchWrap) {
        const allBtn = batchWrap.querySelector('[data-batch-all]');
        const noneBtn = batchWrap.querySelector('[data-batch-none]');
        if (allBtn) allBtn.onclick = () => {
          batchWrap.querySelectorAll('input[data-batch-idx]').forEach((b) => { b.checked = true; });
        };
        if (noneBtn) noneBtn.onclick = () => {
          batchWrap.querySelectorAll('input[data-batch-idx]').forEach((b) => { b.checked = false; });
        };
      }
      const withBatch = (extra) => {
        const base = Object.assign({}, extra || {});
        const sel = readSelectedIndices();
        if (sel !== null) base.selected_indices = sel;
        return base;
      };
      wrap.querySelector('.allow').onclick = () => {
        if (batchWrap) {
          const sel = readSelectedIndices() || [];
          if (!sel.length) {
            addBubble('sys', '请至少勾选一条变更后再允许');
            return;
          }
        }
        if (needTyped) {
          if (typedWrap && !typedWrap.classList.contains('open')) {
            typedWrap.classList.add('open');
            if (otpWrap) otpWrap.classList.add('open');
            if (typedInput) typedInput.focus();

            respondPerm(card.permission_id, 'allow_once', wrap, allowLabel, withBatch({

              otp_code: otp,

            }));

          }
          respondPerm(card.permission_id, 'allow_once', wrap, allowLabel, withBatch({
            typed_confirm: typed,
            ai_explanation_viewed: explainViewed,
            remember_confirm: readRemember(),
          }));
          return;
        }
        if (needOtp) {
          if (otpWrap && !otpWrap.classList.contains('open')) {
            otpWrap.classList.add('open');
            if (otpInput) otpInput.focus();
            addBubble('sys', '请输入动态口令后再次点允许');
            return;
          }
          const otp = otpInput ? String(otpInput.value || '').trim() : '';
          if (!/^\d{6,8}$/.test(otp)) {
            addBubble('sys', '请输入当前动态口令（6～8 位数字）');
            if (otpInput) otpInput.focus();
            return;
          }
          respondPerm(card.permission_id, 'allow_once', wrap, allowLabel, withBatch({
            otp_code: otp,
            ai_explanation_viewed: explainViewed,
            remember_confirm: readRemember(),
          }));
          return;
        }
        respondPerm(card.permission_id, 'allow_once', wrap, allowLabel, withBatch({
          ai_explanation_viewed: explainViewed,
          remember_confirm: readRemember(),
        }));
      };
      wrap.querySelector('.deny').onclick = () => respondPerm(
        card.permission_id, 'deny', wrap, denyLabel, {
          ai_explanation_viewed: explainViewed,
        },
      );
      logEl.appendChild(wrap);
      trimLiveLogIfNeeded();
      scrollLogToBottom();
      // 确认卡不可完整复原交互态：只记一条系统摘要防过载
      appendTranscript({
        role: 'sys',
        text: '确认卡 · ' + (card.title || '待确认') +
          (summary ? (' · ' + summary.slice(0, 80)) : '') +
          '（刷新后需重新发起才会再出可操作卡）',
        kind: 'card_stub',
      });
      const btns = wrap.querySelector('.btns');
      try {
        if (btns && btns.scrollIntoView) {
          requestAnimationFrame(() => {
            btns.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
          });
        }
      } catch (_) {}
    }

    async function readSse(res, onEvent) {
      if (!res.ok) {
        let detail = res.statusText;
        try {
          const j = await res.json();
          detail = j.detail || JSON.stringify(j);
        } catch (_) {}
        throw new Error(detail);
      }
      const reader = res.body.getReader();
      const dec = new TextDecoder();
      let buf = '';
      const flushBlock = (block) => {
        for (const line of block.split('\n')) {
          if (!line.startsWith('data:')) continue;
          const raw = line.slice(5).trim();
          if (!raw) continue;
          try { onEvent(JSON.parse(raw)); } catch (_) {}
        }
      };
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        const parts = buf.split('\n\n');
        buf = parts.pop() || '';
        for (const block of parts) flushBlock(block);
      }
      // 冲刷尾部残留（避免最后一条 done 丢在 buffer 里导致一直 busy）
      buf += dec.decode();
      if (buf.trim()) {
        for (const block of buf.split('\n\n')) flushBlock(block);
      }
    }

    function createHostTabsPanel(ev) {
      const runId = String((ev && ev.run_id) || '');
      const hosts = Array.isArray(ev && ev.hosts) ? ev.hosts : [];
      const card = document.createElement('div');
      card.className = 'host-tabs-card' + ((ev && ev.phase === 'planning') ? ' ht-planning' : '');
      card.setAttribute('data-run-id', runId);
      const state = {
        runId: runId,
        name: String((ev && ev.name) || '多主机任务'),
        active: '',
        hosts: {},
        order: [],
        barrier: false,
        phase: String((ev && ev.phase) || 'running'),
      };
      hosts.forEach(function (h) {
        const id = String((h && (h.id || h.host_id)) || '').trim();
        if (!id) return;
        state.order.push(id);
        state.hosts[id] = {
          id: id,
          name: String((h && h.name) || id),
          status: 'pending',
          exit_code: null,
          stdout_tail: '',
          stdout_detail: '',
          error: '',
          duration_ms: 0,
          last_command: '',
        };
      });
      if (state.order.length) state.active = state.order[0];

      card.innerHTML =
        '<div class="ht-head">' +
        '<span class="ht-title"></span>' +
        '<span class="ht-progress"></span>' +
        '</div>' +
        '<div class="ht-tabs"></div>' +
        '<div class="ht-body">' +
        '<div class="ht-meta"></div>' +
        '<div class="ht-out"></div>' +
        '</div>' +
        '<div class="ht-summary"><div class="ht-summary-label">Chiby 总览</div><div class="ht-summary-body"></div></div>';

      const titleEl = card.querySelector('.ht-title');
      const progEl = card.querySelector('.ht-progress');
      const tabsEl = card.querySelector('.ht-tabs');
      const metaEl = card.querySelector('.ht-meta');
      const outEl = card.querySelector('.ht-out');
      const summaryWrap = card.querySelector('.ht-summary');
      const summaryBody = card.querySelector('.ht-summary-body');

      function statusCount() {
        let ok = 0, fail = 0, run = 0, pending = 0;
        state.order.forEach(function (id) {
          const s = (state.hosts[id] && state.hosts[id].status) || 'pending';
          if (s === 'ok') ok += 1;
          else if (s === 'fail') fail += 1;
          else if (s === 'running') run += 1;
          else if (s === 'cancelled') fail += 1;
          else pending += 1;
        });
        return { ok: ok, fail: fail, run: run, pending: pending, total: state.order.length };
      }

      function paintProgress() {
        const c = statusCount();
        const finished = c.ok + c.fail;
        titleEl.textContent = state.name + ' · ' + c.total + ' 台';
        const phaseLabel = ({
          planning: '规划中',
          init: '理解问题',
          similar_cases: '匹配相似案例',
          executing: '并行排查中',
          analyzing: '分析归纳中',
          suggesting: '生成建议中',
          done: '已完成',
        })[state.phase] || '';
        // 仍有 pending/running 时绝不能显示「全部结束」
        if (state.barrier && c.pending === 0 && c.run === 0) {
          progEl.textContent =
            '全部结束 ' + c.ok + '/' + c.total +
            (c.fail ? (' · 失败 ' + c.fail) : '') +
            ' · 可看总览';
          card.classList.add('ht-barrier');
          card.classList.remove('ht-planning');
        } else if (state.phase === 'planning' || state.phase === 'init' || state.phase === 'similar_cases') {
          progEl.textContent = (phaseLabel || '规划中') + ' · 页签已就绪，扇出后逐台更新';
          card.classList.add('ht-planning');
        } else if (state.phase === 'analyzing' || state.phase === 'suggesting') {
          progEl.textContent = phaseLabel + ' · 主机 ' + finished + '/' + c.total;
          card.classList.remove('ht-planning');
        } else {
          state.barrier = false;
          card.classList.remove('ht-barrier');
          progEl.textContent =
            (phaseLabel ? phaseLabel + ' · ' : '') +
            '进行中 ' + finished + '/' + c.total +
            (c.run ? (' · 执行中 ' + c.run) : '') +
            (c.pending ? (' · 等待 ' + c.pending) : '');
          card.classList.remove('ht-planning');
        }
      }

      function applyDiagPhase(phase) {
        if (!phase) return;
        state.phase = String(phase);
        paintProgress();
      }

      function allHostsTerminal() {
        const c = statusCount();
        return c.total > 0 && c.pending === 0 && c.run === 0;
      }

      function maybeAutoBarrier() {
        if (state.barrier) return;
        if (!allHostsTerminal()) return;
        state.barrier = true;
        state.phase = 'done';
        card.classList.add('ht-barrier');
        card.classList.remove('ht-planning');
        paintProgress();
      }

      function renderTabs() {
        paintProgress();
        tabsEl.innerHTML = '';
        state.order.forEach(function (id) {
          const h = state.hosts[id];
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'ht-tab' + (id === state.active ? ' active' : '');
          btn.innerHTML =
            '<span class="ht-dot ' + esc(h.status || 'pending') + '"></span>' +
            '<span class="ht-tab-label">' + esc(h.name || id) + '</span>';
          btn.title = id + ' · ' + (h.status || '');
          btn.onclick = function () {
            state.active = id;
            renderTabs();
            renderBody();
          };
          tabsEl.appendChild(btn);
        });
      }

      function renderBody() {
        const h = state.hosts[state.active];
        if (!h) {
          metaEl.textContent = '暂无主机';
          outEl.textContent = '';
          return;
        }
        const bits = [
          '状态：' + (h.status || 'pending'),
          h.exit_code != null ? ('exit=' + h.exit_code) : '',
          h.duration_ms ? (h.duration_ms + 'ms') : '',
          h.last_command ? ('命令：' + h.last_command) : '',
        ].filter(Boolean);
        metaEl.textContent = bits.join(' · ');
        outEl.textContent = (h.stdout_detail || h.stdout_tail || h.error ||
          (state.phase === 'planning' ? '（规划中，等待扇出执行）' : '（等待输出）'));
      }

      function upsertTask(ev2) {
        const id = String((ev2 && ev2.host_id) || '').trim();
        if (!id) return;
        if (!state.hosts[id]) {
          state.order.push(id);
          state.hosts[id] = { id: id, name: String((ev2 && ev2.host_label) || id), status: 'pending' };
        }
        const h = state.hosts[id];
        if (ev2.host_label) h.name = String(ev2.host_label);
        if (ev2.status) h.status = String(ev2.status);
        if (ev2.exit_code != null) h.exit_code = ev2.exit_code;
        if (ev2.stdout_tail != null) h.stdout_tail = String(ev2.stdout_tail || '');
        if (ev2.stdout_detail != null) h.stdout_detail = String(ev2.stdout_detail || '');
        if (ev2.error != null) h.error = String(ev2.error || '');
        if (ev2.duration_ms != null) h.duration_ms = Number(ev2.duration_ms) || 0;
        if (ev2.last_command != null) h.last_command = String(ev2.last_command || '');
        if (state.phase === 'planning' && h.status && h.status !== 'pending') {
          state.phase = 'running';
        }
        if (h.status === 'fail' || h.status === 'running' || !state.active) {
          state.active = id;
        }
        maybeAutoBarrier();
        renderTabs();
        renderBody();
        scrollLogToBottom();
      }

      function markBarrier(ev2) {
        const scope = String((ev2 && ev2.scope) || '');
        // 本批结束：若仍有其它协议主机 pending，不抬整轮屏障
        if (scope === 'batch' && !allHostsTerminal()) {
          state.phase = 'running';
          paintProgress();
          scrollLogToBottom();
          return;
        }
        if (!allHostsTerminal() && scope !== 'turn') {
          paintProgress();
          return;
        }
        state.barrier = true;
        state.phase = 'done';
        card.classList.add('ht-barrier');
        card.classList.remove('ht-planning');
        paintProgress();
        scrollLogToBottom();
      }

      function markDone(ev2, opts) {
        const o = opts || {};
        if (ev2 && ev2.snapshot && Array.isArray(ev2.snapshot.tasks)) {
          ev2.snapshot.tasks.forEach(function (t) {
            upsertTask(t);
          });
        }
        const scope = String((ev2 && ev2.scope) || '');
        if (scope === 'batch') {
          maybeAutoBarrier();
          paintProgress();
        } else {
          markBarrier(ev2 || {});
        }
        paintProgress();
        if (o.skipPersist) return;
        try {
          appendTranscript({
            role: 'bot',
            kind: 'host_panel',
            text: JSON.stringify({
              run_id: state.runId,
              name: state.name,
              hosts: state.order.map(function (id) {
                const h = state.hosts[id];
                return {
                  id: id,
                  name: h.name,
                  status: h.status,
                  stdout_tail: (h.stdout_tail || '').slice(0, 400),
                  error: (h.error || '').slice(0, 200),
                };
              }),
            }),
          });
        } catch (_) {}
      }

      function setSummary(text) {
        if (!state.barrier) return;
        const t = humanizeHostIdsInText(String(text || '').trim());
        if (!t) return;
        summaryBody.classList.add('md');
        if (typeof renderMarkdown === 'function') {
          summaryBody.innerHTML = renderMarkdown(t);
        } else {
          summaryBody.textContent = t;
        }
        summaryWrap.classList.add('show');
        scrollLogToBottom();
      }

      function adoptRun(ev2) {
        const rid = String((ev2 && ev2.run_id) || '');
        if (rid) {
          state.runId = rid;
          card.setAttribute('data-run-id', rid);
        }
        // 保留「多主机任务」总标题；勿被 ssh_batch 工具名覆盖
        if (ev2 && ev2.name && ev2.name !== 'ssh_batch' && ev2.name !== 'winrm_batch') {
          state.name = String(ev2.name);
        }
        state.phase = String((ev2 && ev2.phase) || 'running');
        state.barrier = false;
        if (Array.isArray(ev2 && ev2.hosts)) {
          ev2.hosts.forEach(function (h) {
            const id = String((h && (h.id || h.host_id)) || '').trim();
            if (!id) return;
            if (!state.hosts[id]) {
              state.order.push(id);
              state.hosts[id] = {
                id: id,
                name: String((h && h.name) || id),
                status: 'pending',
              };
            } else if (h.name) {
              state.hosts[id].name = String(h.name);
            }
          });
        }
        renderTabs();
        renderBody();
      }

      function finalizeTurn() {
        // 回合结束：仍 pending 的标为未更新，再抬屏障以便展示总览
        state.order.forEach(function (id) {
          const h = state.hosts[id];
          if (!h) return;
          if (h.status === 'pending' || h.status === 'running') {
            h.status = 'cancelled';
            if (!h.error) h.error = '本轮未收到该主机执行结果';
          }
        });
        state.barrier = true;
        state.phase = 'done';
        card.classList.add('ht-barrier');
        card.classList.remove('ht-planning');
        paintProgress();
        renderTabs();
        renderBody();
      }

      renderTabs();
      renderBody();
      logEl.appendChild(card);
      trimLiveLogIfNeeded();
      scrollLogToBottom();
      return {
        el: card,
        get runId() { return state.runId; },
        get barrier() { return state.barrier; },
        upsertTask: upsertTask,
        markDone: markDone,
        markBarrier: markBarrier,
        setSummary: setSummary,
        adoptRun: adoptRun,
        finalizeTurn: finalizeTurn,
        maybeAutoBarrier: maybeAutoBarrier,
        applyDiagPhase: applyDiagPhase,
      };
    }

    let diagProgressPanel = null;
    function ensureDiagProgressPanel() {
      if (diagProgressPanel && diagProgressPanel.el && diagProgressPanel.el.isConnected) {
        return diagProgressPanel;
      }
      const el = document.createElement('div');
      el.className = 'diag-progress-card';
      el.innerHTML =
        '<div class="dp-title"></div>' +
        '<div class="dp-bar"><i></i></div>' +
        '<div class="dp-meta"></div>' +
        '<div class="dp-tools"></div>';
      logEl.appendChild(el);
      diagProgressPanel = {
        el: el,
        titleEl: el.querySelector('.dp-title'),
        barEl: el.querySelector('.dp-bar > i'),
        metaEl: el.querySelector('.dp-meta'),
        toolsEl: el.querySelector('.dp-tools'),

    }
    function paintDiagnosisProgress(ev) {
      const p = ensureDiagProgressPanel();
      const phase = String((ev && ev.phase) || '');
      const phaseText = ({
        init: '正在理解问题、构建排查计划',
        similar_cases: '📚 正在检索相似历史案例',
        executing: '🔍 正在并行排查主机',
        analyzing: '🧠 正在分析结果、归纳结论',
        suggesting: '✍️ 正在生成修复建议',
        done: '✅ 排查完成',
      })[phase] || (ev && ev.text) || '排查进行中';
      const total = Number(ev && ev.total_hosts) || 0;
      const done = Number(ev && ev.completed_hosts) || 0;
      const fail = Number(ev && ev.failed_hosts) || 0;
      const pct = total > 0 ? Math.min(100, Math.round((done / total) * 100)) : (
        phase === 'done' ? 100 : (phase === 'suggesting' ? 90 : (phase === 'analyzing' ? 75 : (phase === 'executing' ? 45 : 15)))
      );
      p.titleEl.textContent = phaseText + (total ? (' · ' + done + '/' + total + ' 台') : '');
      p.barEl.style.width = pct + '%';
      const elapsed = Number(ev && ev.elapsed_ms) || Math.round(performance.now() - p.startedAt);
      const remain = Number(ev && ev.estimated_remaining_ms) || 0;
      p.metaEl.textContent =
        '进度 ' + pct + '%' +
        (fail ? (' · 失败 ' + fail) : '') +
        ' · 已用 ' + (elapsed / 1000).toFixed(1) + 's' +
        (remain ? (' · 预计剩余 ' + (remain / 1000).toFixed(1) + 's') : '') +
        (ev && ev.current_tool ? (' · ' + ev.current_tool) : '');
      const tp = (ev && ev.tool_progress) || {};
      const keys = Object.keys(tp);
      if (keys.length) {
        p.toolsEl.innerHTML = keys.map(function (k) {
          const st = String(tp[k] || 'pending');
          const cls = st === 'completed' || st === 'ok' ? 'is-ok'
            : (st === 'running' ? 'is-run' : (st === 'failed' || st === 'timeout' ? 'is-fail' : ''));
          const mark = st === 'completed' || st === 'ok' ? '✅'
            : (st === 'running' ? '⏳' : (st === 'failed' || st === 'timeout' ? '❌' : '·'));
          return '<div class="dp-tool ' + cls + '"><span>' + mark + ' ' + esc(k) + '</span><span>' + esc(st) + '</span></div>';
        }).join('');
      } else if (ev && ev.text) {
        p.toolsEl.textContent = String(ev.text);
      } else {
        p.toolsEl.textContent = '';
      }
      if (hostTabsPanel && typeof hostTabsPanel.applyDiagPhase === 'function') {
        hostTabsPanel.applyDiagPhase(phase);
      }
      scrollLogToBottom();
    }

    function restoreHostPanelFromEntry(item) {
      try {
        const data = JSON.parse(String(item.text || ''));
        if (!data || !Array.isArray(data.hosts) || !data.hosts.length) return;
        const panel = createHostTabsPanel({
          run_id: data.run_id || '',
          name: data.name || '多主机任务',
          hosts: data.hosts.map(function (h) {
            return { id: h.id, name: h.name || h.id };
          }),
        });
        data.hosts.forEach(function (h) {
          panel.upsertTask({
            host_id: h.id,
            host_label: h.name,
            status: h.status || 'ok',
            stdout_tail: h.stdout_tail || '',
            error: h.error || '',
          });
        });
        panel.markDone({
          ok_count: data.hosts.filter(function (h) { return h.status === 'ok'; }).length,
          fail_count: data.hosts.filter(function (h) { return h.status === 'fail'; }).length,
          total: data.hosts.length,
        }, { skipPersist: true });
      } catch (_) {}
    }

    async function runStream(url, body, waitingLabel) {
      abortCtrl = new AbortController();
      const rawHermes = agentMode === 'omnipotent';
      activeTermStatus = createTerminalStatus({ mode: agentMode });
      setBusy(true);
      const waiting = startWaiting(waitingLabel || '', { rawHermes, termStatus: activeTermStatus });
      const term = activeTermStatus;
      const t0 = performance.now();
      let streamBubble = null;
      let thoughtPanel = null;
      let hostTabsPanel = null;
      diagProgressPanel = null;
      let finalReply = null;
      let pendingCard = null;
      let hostDone = 0;
      let hostTotal = 0;

      try {
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Accept: 'text/event-stream' },
          signal: abortCtrl.signal,
          body: JSON.stringify(body),
        });
        await readSse(res, (ev) => {
          const typ = ev && ev.type;
          if (typ === 'host_panel') {
            // 规划阶段就露出页签；关掉等待气泡以免盖住面板
            if (waiting && waiting.markContentReady) waiting.markContentReady();
            const hosts = (ev && ev.hosts) || [];
            hostTotal = Math.max(hostTotal, hosts.length || 0);
            if (hostTotal > 0) term.onHostProgress(hostDone, hostTotal);
            else term.onRaw(ev.phase === 'planning' ? '正在分析任务…' : '正在执行…', {});
            if (!hostTabsPanel) {
              hostTabsPanel = createHostTabsPanel(ev);
            } else if (String(ev.run_id || '') && hostTabsPanel.runId !== String(ev.run_id || '')) {
              // 规划骨架 → 正式扇出：同面板 adopt，避免闪两张卡
              if (typeof hostTabsPanel.adoptRun === 'function') hostTabsPanel.adoptRun(ev);
              else hostTabsPanel = createHostTabsPanel(ev);
            } else if (typeof hostTabsPanel.adoptRun === 'function') {
              hostTabsPanel.adoptRun(ev);
            }
          } else if (typ === 'host_task') {
            if (!hostTabsPanel) {
              hostTabsPanel = createHostTabsPanel({
                run_id: ev.run_id,
                name: '多主机任务',
                hosts: [{ id: ev.host_id, name: ev.host_label || ev.host_id }],
              });
            }
            hostTabsPanel.upsertTask(ev);
            const st = String(ev.status || '');
            if (st === 'ok' || st === 'fail') {
              hostDone += 1;
              term.onHostProgress(hostDone, Math.max(hostTotal, hostDone));
            } else {
              term.onRaw('正在执行…', { stage: 'exec_start' });
            }
          } else if (typ === 'host_panel_barrier') {
            if (hostTabsPanel && typeof hostTabsPanel.markBarrier === 'function') {
              hostTabsPanel.markBarrier(ev || {});
            }
            const batchOnly = ev && ev.scope === 'batch' && hostTabsPanel && !hostTabsPanel.barrier;
            term.onRaw(
              batchOnly ? '正在执行…' : '正在整理结果…',
              { stage: batchOnly ? 'exec_start' : 'feedback_start' },
            );
          } else if (typ === 'host_panel_done') {
            if (hostTabsPanel) hostTabsPanel.markDone(ev || {});
            term.setDone({
              ok_count: ev && ev.ok_count,
              fail_count: ev && ev.fail_count,
            });
          } else if (typ === 'multi_host_summary' && ev.text) {
            if (hostTabsPanel) hostTabsPanel.setSummary(ev.text);
            else if (!streamBubble) {
              // 总览落到正文气泡
            }
          } else if (typ === 'diagnosis_progress') {
            paintDiagnosisProgress(ev || {});
          } else if (typ === 'similar_cases' && (ev.text || (ev.cases && ev.cases.length))) {
            paintDiagnosisProgress({
              phase: 'similar_cases',
              text: ev.text || '',
              total_hosts: (ev.cases && ev.cases.length) || 0,
            });
            const box = document.createElement('div');
            box.className = 'similar-cases-bubble';
            box.textContent = ev.text || ('📚 找到 ' + (ev.cases || []).length + ' 个相似历史案例');
            logEl.appendChild(box);
            scrollLogToBottom();
          } else if (typ === 'thought_step') {
            if (waiting && waiting.upsertThought) waiting.upsertThought(ev);
            term.onThought(ev);
          } else if (typ === 'phase') {
            term.onRaw(ev.text || '', {});
            // 智能型：从「远端执行 N 条」宣布计划步数
            const pm = String(ev.text || '').match(/远端执行\s*(\d+)\s*条/);
            if (pm && agentMode === 'intelligent') {
              term.announcePlanSteps(parseInt(pm[1], 10) || 0);
            }
          } else if (typ === 'status') {
            term.onRaw(ev.text || ev.stage || '', { stage: ev.stage || '' });
          } else if (typ === 'thought_delta' && ev.text != null && ev.text !== '') {
            if (waiting && waiting.markContentReady) waiting.markContentReady();
            if (!thoughtPanel) {
              thoughtPanel = createDeepThinkPanel(
                streamBubble && streamBubble.el ? streamBubble.el : null,
              );
            }
            thoughtPanel.append(ev.text);
          } else if (typ === 'delta' && ev.text) {
            if (thoughtPanel) thoughtPanel.collapse();
            if (!streamBubble) {
              if (waiting && waiting.markContentReady) waiting.markContentReady();
              streamBubble = createStreamBubble();
              // 正文气泡应在思考面板之后（思考已先到时保持顺序）
              if (thoughtPanel && thoughtPanel.el && streamBubble.el.parentNode === logEl) {
                logEl.insertBefore(streamBubble.el, thoughtPanel.el.nextSibling);
              }
            }
            streamBubble.append(ev.text);
          } else if (typ === 'turn') {
            const tid = ev.turn_id || ev.trace_id;
            if (tid) saveSession({ lastTurnId: tid });
          } else if (typ === 'file_transfer') {
            if (!streamBubble) {
              if (waiting && waiting.markContentReady) waiting.markContentReady();
              streamBubble = createStreamBubble();
            }
            mountFileTransfers(streamBubble.el, [ev]);
          } else if (typ === 'done') {
            finalReply = ev.reply || null;
          } else if (typ === 'error') {
            throw new Error(ev.message || 'stream error');
          }
        });

        const sec = ((performance.now() - t0) / 1000).toFixed(1);
        if (thoughtPanel) thoughtPanel.collapse();
        // 回合结束：把仍 pending 的页签收束，再允许总览
        if (hostTabsPanel && typeof hostTabsPanel.finalizeTurn === 'function') {
          hostTabsPanel.finalizeTurn();
        }

        if (!finalReply) {
          term.setDone({});
          if (waiting && waiting.markContentReady) waiting.markContentReady();
          if (!streamBubble) addBubble('bot', '(无回复)');
          else streamBubble.finalize('耗时 ' + sec + 's');
          return;
        }

        if (finalReply.meta && finalReply.meta.agent_mode) {
          // 仅正式 ID 回写顶栏；勿把遗留 advanced 误刷成智能型（会冲掉全能型）
          const am = String(finalReply.meta.agent_mode || '');
          if (
            am === 'omnipotent' ||
            am === 'intelligent' ||
            am === 'efficient' ||
            am === 'ops'
          ) {
            paintMode(am);
          }
        }
        if (finalReply.meta && finalReply.meta.host_id) {
          saveSession({ boundHostId: finalReply.meta.host_id });
        }
        if (
          hostTabsPanel &&
          finalReply.meta &&
          finalReply.meta.multi_host_summary
        ) {
          if (!hostTabsPanel.barrier && typeof hostTabsPanel.markBarrier === 'function') {
            hostTabsPanel.markBarrier({
              ok_count: (finalReply.meta.host_panel && finalReply.meta.host_panel.ok_count) || undefined,
              total: (finalReply.meta.host_panel && finalReply.meta.host_panel.total) || undefined,
            });
          }
          hostTabsPanel.setSummary(finalReply.meta.multi_host_summary);
        }
        // SSE 丢事件兜底：用 done.meta.host_panel 恢复页签
        if (
          !hostTabsPanel &&
          finalReply.meta &&
          finalReply.meta.host_panel &&
          Array.isArray(finalReply.meta.host_panel.hosts) &&
          finalReply.meta.host_panel.hosts.length
        ) {
          const snap = finalReply.meta.host_panel;
          hostTabsPanel = createHostTabsPanel({
            run_id: snap.run_id || finalReply.meta.run_id || '',
            name: snap.name || '多主机任务',
            hosts: snap.hosts,
          });
          (snap.tasks || []).forEach(function (t) {
            hostTabsPanel.upsertTask(t);
          });
          hostTabsPanel.markDone({
            ok_count: snap.ok_count,
            fail_count: snap.fail_count,
            total: snap.total || (snap.hosts || []).length,
            snapshot: snap,
          }, { skipPersist: true });
          if (finalReply.meta.multi_host_summary) {
            hostTabsPanel.setSummary(finalReply.meta.multi_host_summary);
          }
        }
        if (finalReply.meta && (finalReply.meta.turn_id || finalReply.meta.trace_id)) {
          const tid = String(finalReply.meta.turn_id || finalReply.meta.trace_id || '');
          if (tid) saveSession({ lastTurnId: tid });
        }

        const plannerLabel = ({
          agent: '运维 Agent',
          hermes: 'Chiby',
          rules: '规则',
        })[(finalReply.meta && finalReply.meta.planner) || ''] || (finalReply.meta && finalReply.meta.planner) || '';
        // 气泡模式：优先 meta 正式 ID；遗留 advanced 按会话纠正；缺省回退顶栏会话模式
        function resolveFooterModeId(metaMode, sessionMode) {
          const m = String(metaMode || '').trim().toLowerCase();
          const s = String(sessionMode || agentMode || 'efficient').trim().toLowerCase();
          const normS = (s === 'omni') ? 'omnipotent'
            : (s === 'ops' || s === 'efficient') ? 'efficient'
            : (s === 'advanced' || s === 'intelligent' || s === 'code' || s === 'programming' || s === 'dev') ? 'intelligent'
            : (s === 'omnipotent') ? 'omnipotent'
            : 'efficient';
          if (m === 'omnipotent' || m === 'omni') return 'omnipotent';
          if (m === 'efficient' || m === 'ops') return 'efficient';
          if (m === 'intelligent') return 'intelligent';
          if (m === 'code' || m === 'programming' || m === 'dev') return 'intelligent';
          // 遗留 advanced：勿在全能会话下显示成智能型
          if (m === 'advanced') return (normS === 'omnipotent') ? 'omnipotent' : 'intelligent';
          return normS;
        }
        const footerModeId = resolveFooterModeId(
          finalReply.meta && finalReply.meta.agent_mode,
          agentMode
        );
        const modeLabel = ({
          efficient: '高效型',
          ops: '高效型',
          intelligent: '智能型',
          advanced: '智能型',
          omnipotent: '全能型',
          code: '智能型·编程',
          programming: '智能型·编程',
        })[footerModeId] || '高效型';
        const turnShort = (finalReply.meta && (finalReply.meta.turn_id || finalReply.meta.trace_id))
          ? String(finalReply.meta.turn_id || finalReply.meta.trace_id).slice(-8)
          : '';
        const awaitingPerm = !!(
          finalReply.reply_type === 'card' ||
          (finalReply.meta && (
            finalReply.meta.awaiting_permission ||
            finalReply.meta.kind === 'advanced_mutate_confirm' ||
            finalReply.meta.kind === 'tsm_l1_card_required'
          ))
        );
        /** 任务状态机脚注：结束须显式；protocol_incomplete 不得显示成「已完成」 */
        function taskPhaseFooter(m) {
          if (!m) return '';
          const phase = String(m.task_phase || '').toLowerCase();
          const reason = String(m.end_reason || '').toLowerCase();
          if (awaitingPerm || phase === 'waiting_user') return '等待你确认';
          if (phase === 'ended') {
            if (reason === 'protocol_incomplete') return '未完成 · 未发出远端指令';
            if (reason === 'blocked') return '任务结束 · 需人工处理';
            if (reason === 'cancelled') return '任务结束 · 已取消';
            if (reason === 'timeout') return '任务结束 · 已超时';
            if (reason === 'cap') return '任务结束 · 已达轮次上限';
            if (reason === 'answer') return '本轮说明';
            if (reason === 'completed' || reason === '') return '任务结束 · 已完成';
            return '任务结束 · ' + reason;
          }
          if (phase === 'running') return '进行中';
          if (phase === 'started') return '任务开始';
          return '';
        }
        const phasePrefix = taskPhaseFooter(finalReply.meta || {});
        let meta = '耗时 ' + sec + 's' +
          (plannerLabel ? (' · ' + plannerLabel) : '') +
          (' · ' + modeLabel) +
          (turnShort ? (' · #' + turnShort) : '');
        if (phasePrefix) meta = phasePrefix + ' · ' + meta;
        else if (awaitingPerm) meta = '等待你确认 · ' + meta;

        // 确认卡 / 已流式：历史结果在气泡里；勿用 done.text 短摘要覆盖长面板
        let displayText = finalReply.text || '';
        if (
          awaitingPerm &&
          streamBubble &&
          streamBubble.text &&
          displayText &&
          displayText.length > 280
        ) {
          displayText = '';
        }

        if (streamBubble) {
          applyDoneTextToStream(
            streamBubble,
            displayText,
            finalReply.meta || {},
          );
          streamBubble.finalize(meta);
        } else if (displayText) {
          const b = createStreamBubble();
          b.setText(displayText);
          b.finalize(meta);
          streamBubble = b;
        } else if (finalReply.reply_type !== 'card') {
          addBubble('bot', '(无文本回复)');
        }

        const xfers = (finalReply.meta && finalReply.meta.file_transfers) || [];
        if (xfers.length) {
          if (!streamBubble) {
            streamBubble = createStreamBubble();
            streamBubble.setText('文件已就绪，可下载：');
            streamBubble.finalize(meta);
          }
          mountFileTransfers(streamBubble.el, xfers);
        }

        if (finalReply.reply_type === 'card' && finalReply.card) {
          pendingCard = finalReply.card;
          term.setConfirm();
        } else {
          const hp = (finalReply.meta && finalReply.meta.host_panel) || {};
          term.setDone({
            ok_count: hp.ok_count,
            fail_count: hp.fail_count,
            all_failed: !!(finalReply.meta && finalReply.meta.error),
          });
        }
        if (
          finalReply.meta &&
          (finalReply.meta.diagnosis_ingest || finalReply.meta.multi_host_summary)
        ) {
          mountDiagnosisActions(streamBubble && streamBubble.el, finalReply.meta);
        }
        if (waiting && waiting.markContentReady) waiting.markContentReady();
      } catch (e) {
        if (waiting && waiting.markContentReady) waiting.markContentReady();
        if (e && e.name === 'AbortError') {
          if (term) term.onRaw('已停止', {});
          addBubble('sys', '已停止');
        } else {
          if (term) term.onRaw('执行失败', {});
          addBubble('bot', '请求失败: ' + e);
        }
      } finally {
        setBusy(false);
        abortCtrl = null;
        /* 必须先解除 busy 再挂卡，否则允许/拒绝会被 respondPerm 静默吞掉 */
        if (pendingCard) {
          addCard(pendingCard);
          // 挂卡后短暂提示（busy 已解除，写在输入占位上）
          if (input) input.placeholder = '> 需确认后才能继续';
        }
        refreshChrome();
      }
    }

    async function refreshChrome() {
      let st = {};
      let auditItems = [];
      try {
        st = await fetch('/api/mobile/demo/status?conversation_id=' + encodeURIComponent(conversationId)).then(r => r.json());
        const snap = (st.snapshot && st.snapshot.conversations) || {};
        const conv = snap[conversationId] || {};
        const convMode = conv.agent_mode || st.agent_mode || agentMode;
        paintMode(convMode);
        if (Array.isArray(conv.ui_host_ids) && conv.ui_host_ids.length && !selectedIds.length) {
          selectedIds = conv.ui_host_ids.slice();
          saveLocalHostTargets(selectedIds);
        } else if (conv.bound_host_id && !selectedIds.length) {
          selectedIds = [conv.bound_host_id];
          saveLocalHostTargets(selectedIds);
        }
        const tip = document.getElementById('readyTip');
        if (tip) {
          tip.textContent = (st.ok ? '就绪' : '未就绪') + ' · ' + (
            agentMode === 'omnipotent' ? '全能' : (agentMode === 'intelligent' ? '智能' : '高效')
          );
        }
      } catch (e) {
        const tip = document.getElementById('readyTip');
        if (tip) tip.textContent = '状态拉取失败';
      }
      try {
        const au = await fetch('/api/mobile/demo/audit?limit=12').then(r => r.json());
        auditItems = au.items || [];
      } catch (_) {}
      renderModeMenuPanels(st, auditItems);
      formatHostBar();
    }

    async function sendText() {
      if (busy) {
        await stopStream();
        return;
      }
      const text = (input.value || '').trim();
      const file = pendingAttachFile;
      if (!text && !file) return;
      input.value = '';
      resizeComposerInput();
      // 发送前同步顶栏选机，避免只绑了首台
      try { await persistTargets(); } catch (_) {}

      let attachmentId = '';
      if (file) {
        try {
          setComposerBusyHint('> 附件上传中…');
          const up = await uploadChatAttachment(file);
          attachmentId = String(up.attachment_id || '');
          clearAttach();
        } catch (e) {
          addBubble('sys', '附件上传失败：' + String((e && e.message) || e));
          return;
        }
      }

      const bubbleText = text
        ? (attachmentId ? (text + '\n[附件] ' + (file && file.name ? file.name : attachmentId)) : text)
        : ('[附件] ' + (file && file.name ? file.name : attachmentId) + '（请 Agent 处理）');
      addBubble('user', bubbleText);
      if (selectedIds.length >= 2) {
        const names = selectedIds.map((id) => {
          const h = hostById(id);
          return (h && (h.name || h.host_id)) || id.slice(0, 8);
        });
        const head = names[0];
        const rest = names.length - 1;
        addBubble(
          'sys',
          '目标 ' + names.length + ' 台：' + head + (rest ? ' +' + rest : '') +
            '（' + names.join('、') + '）',
        );
      } else if (selectedIds.length === 1) {
        const h = hostById(selectedIds[0]);
        const nm = (h && (h.name || h.host_id)) || selectedIds[0].slice(0, 8);
        addBubble('sys', '目标主机：' + nm);
      }
      const body = {
        channel: 'demo',
        external_user_id: userId,
        conversation_id: conversationId,
        text: text || '',
        external_msg_id: 'm_' + Date.now(),
        // 本回合选机权威：与顶栏气泡一致，避免仅本地选了 yl 而服务端仍 hydrate 旧主机
        ui_host_ids: Array.isArray(selectedIds) ? selectedIds.slice() : [],
      };
      if (attachmentId) body.attachment_id = attachmentId;
      await runStream('/api/mobile/demo/message/stream', body, '');
    }

    async function respondPerm(permissionId, choice, cardEl, label, extra) {
      if (cardEl && cardEl.classList.contains('card-resolved')) return;
      if (busy) {
        addBubble('sys', '请稍候，上一轮还在处理中…处理完后再点允许/拒绝。');
        return;
      }
      const choiceLabel = label || (choice === 'allow_once' ? '允许' : '拒绝');
      if (cardEl) {
        cardEl.classList.add('card-resolved');
        const buttons = cardEl.querySelectorAll('.btns button');
        buttons.forEach((b) => {
          b.disabled = true;
          const isPicked = (
            (choice === 'allow_once' && b.classList.contains('allow')) ||
            (choice === 'deny' && b.classList.contains('deny'))
          );
          if (isPicked) {
            b.classList.add('is-picked');
            b.textContent = choiceLabel + '(已选择)';
          }
        });
      }
      addBubble('sys', '已选择：' + choiceLabel);
      const body = {
        conversation_id: conversationId,
        permission_id: permissionId,
        choice,
        external_user_id: userId,
        typed_confirm: (extra && extra.typed_confirm) || '',
        otp_code: (extra && extra.otp_code) || '',
        ai_explanation_viewed: !!(extra && extra.ai_explanation_viewed),
        remember_confirm: !!(extra && extra.remember_confirm),
        selected_indices: (extra && Array.isArray(extra.selected_indices))
          ? extra.selected_indices : null,
      };
      await runStream(
        '/api/mobile/demo/permission/stream',
        body,
        choice === 'allow_once' ? '已允许，继续执行' : '已取消，操作未执行',
      );
    }

    sendBtn.onclick = sendText;

    (function wireAttachControls() {
      const attachBtn = document.getElementById('attachBtn');
      const attachInput = document.getElementById('attachFileInput');
      const clearBtn = document.getElementById('attachClearBtn');
      if (attachBtn && attachInput) {
        attachBtn.onclick = function (e) {
          e.stopPropagation();
          if (busy) return;
          attachInput.click();
        };
        attachInput.onchange = function () {
          const f = attachInput.files && attachInput.files[0];
          pendingAttachFile = f || null;
          paintAttachBar();
        };
      }
      if (clearBtn) clearBtn.onclick = clearAttach;
    })();

    function resizeComposerInput() {
      const el = input;
      if (!el) return;
      const maxH = 160;
      const minH = 36;
      el.classList.remove('has-overflow');
      el.style.overflowY = 'hidden';
      el.style.height = 'auto';
      const sh = el.scrollHeight;
      el.style.height = Math.min(maxH, Math.max(minH, sh)) + 'px';
      const overflows = sh > maxH;
      el.classList.toggle('has-overflow', overflows);
      el.style.overflowY = overflows ? 'auto' : 'hidden';
    }
    input.addEventListener('input', resizeComposerInput);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        if (busy) stopStream();
        else sendText();
      }
    });
    window.addEventListener('assistant-font-scale', resizeComposerInput);
    resizeComposerInput();

    const restored = restoreTranscript();
    if (restored) {
      addBubble(
        'sys',
        '已从本机恢复近期对话（最多 ' + TRANSCRIPT_MAX_ITEMS + ' 条；确认卡需重新发起）',
        { skipPersist: true },
      );
    } else {
      addBubble('sys',
        '已就绪 · 顶栏选主机（可多台）· 右上切换高效型/智能型/全能型 · 底栏＋可添加/删除快捷消息。');
    }
    paintMode(agentMode);
    renderQuickMenu();
    hostPickerBtn.onclick = openHostModal;
    document.getElementById('hostModalClose').onclick = closeHostModal;
    document.getElementById('hostModalCancel').onclick = closeHostModal;
    document.getElementById('explainModalClose').onclick = closeExplainModal;
    document.getElementById('explainModalCancel').onclick = closeExplainModal;
    document.getElementById('explainModalOk').onclick = closeExplainModal;
    explainModal.addEventListener('click', (e) => {
      if (e.target === explainModal) closeExplainModal();
    });
    document.getElementById('hostModalOk').onclick = async () => {
      closeHostModal();
      await persistTargets();
      const n = selectedIds.length;
      addBubble('sys', n ? ('已选择 ' + n + ' 台主机') : '已清空主机选择');
    };
    document.getElementById('hostModalMulti').onclick = () => {
      // 「多选」↔「单选」切换；切到单选时仅保留当前第一台
      hostPickerMulti = !hostPickerMulti;
      if (!hostPickerMulti && selectedIds.length > 1) {
        selectedIds = [selectedIds[0]];
      }
      renderHostModalList();
    };
    document.getElementById('hostModalNone').onclick = () => {
      selectedIds = [];
      renderHostModalList();
    };
    hostDetailBtn.onclick = (e) => { e.stopPropagation(); showHostDetail(); };
    hostSummaryBtn.onclick = (e) => { e.stopPropagation(); showHostMulti(); };
    modeIconBtn.onclick = (e) => {
      e.stopPropagation();
      const open = !modeMenu.classList.contains('open');
      closeAllPop();
      if (open) { refreshChrome(); modeMenu.classList.add('open'); }
    };
    document.getElementById('menuModeOps').onclick = () => { closeAllPop(); setAgentMode('efficient'); };
    document.getElementById('menuModeAdvanced').onclick = () => { closeAllPop(); setAgentMode('intelligent'); };
    const menuModeOmni = document.getElementById('menuModeOmni');
    if (menuModeOmni) menuModeOmni.onclick = () => { closeAllPop(); setAgentMode('omnipotent'); };
    quickBtn.onclick = (e) => {
      e.stopPropagation();
      const open = !quickMenu.classList.contains('open');
      closeAllPop();
      if (open) { renderQuickMenu(); quickMenu.classList.add('open'); }
    };
    document.addEventListener('click', () => closeAllPop());
    modeMenu.onclick = (e) => e.stopPropagation();
    quickMenu.onclick = (e) => e.stopPropagation();
    hostDetailPop.onclick = (e) => e.stopPropagation();
    hostMultiPop.onclick = (e) => e.stopPropagation();
    const scopeBadgeClear = document.getElementById('scopeBadgeClear');
    if (scopeBadgeClear) {
      scopeBadgeClear.addEventListener('click', (e) => {
        e.stopPropagation();
        clearScopeTargets();
      });
    }
    loadCatalog()
      .then(() => hydrateHostTargetsFromServer())
      .then(() => persistTargets())
      .catch(() => formatHostBar());
    setAgentMode(agentMode, { silent: true }).finally(() => refreshChrome());
  
  </script>
</body>
</html>
